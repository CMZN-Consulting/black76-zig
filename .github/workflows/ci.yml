# The gate this repository exists to be, run on itself.
#
# No third-party actions: the Zig toolchain is fetched from ziglang.org at a
# pinned version and checked by hand. Fewer moving parts, and nothing to trust
# that you cannot read here.
name: ci

# Branch pushes and PRs only — a tag adds no code, and its commit was already
# gated when the branch push ran. (A bare `push:` also fires on tag refs; the
# v1.0.0 tag spawned a doomed duplicate matrix run that way, 2026-08-31.)
on:
  push:
    branches: ["**"]
  pull_request:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  check:
    name: "${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    # BOTH ARCHITECTURES GATE. aarch64 used to be informational -- the golden
    # vectors were captured on x86_64 and whether another architecture
    # reproduced them bit-for-bit had never been tested, so a red mark there
    # would have been a finding rather than a broken build. It has been tested
    # now: aarch64 replays 3,516/3,516 on real silicon. Cross-architecture
    # bit-identity is therefore a PROMISE this repository makes, and a promise
    # that does not gate is a note.
    #
    # `continue-on-error` is gone rather than set to false, and the matrix's
    # `informational` key with it: a flag whose only value is the default is a
    # place for the old behaviour to come back.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "x86_64"
            runner: "ubuntu-latest"
            zig_target: "x86_64"
          - arch: "aarch64"
            runner: "ubuntu-24.04-arm"
            zig_target: "aarch64"

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${{ matrix.zig_target }}-linux-${ZIG_VERSION}.tar.xz"
          echo "fetching $url"
          curl -fsSL "$url" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Toolchain is the pinned one
        run: |
          set -euo pipefail
          zig version
          test "$(zig version)" = "${ZIG_VERSION}"

      - name: Formatting
        run: zig fmt --check .

      # THE FULL MODE x LANE-WIDTH MATRIX, because each cell answers a
      # different question and the three modes are not interchangeable:
      #
      #   Debug        unoptimised, assertions ON  -- the kernel's own
      #                postconditions actually run
      #   ReleaseSafe  OPTIMISED,   assertions ON  -- the only cell where the
      #                optimiser and the assertions meet. Neither of the other
      #                two covers it, and it was not run here at all until now.
      #   ReleaseFast  optimised,   assertions off -- what ships
      #
      # crossed with lane width, because the batch path is SIMD and its lane
      # count follows the CPU: `-Dcpu=baseline` is the 2-lane path and its
      # scalar tail, the runner's own CPU is the widest width it has. Replaying
      # bit-for-bit in all six is the claim that neither optimisation level nor
      # vector width is part of the contract.
      - name: Replay the golden vectors (Debug, assertions on)
        run: zig build test

      - name: Replay the golden vectors (Debug, narrowest lane width)
        run: zig build test -Dcpu=baseline

      - name: Replay the golden vectors (ReleaseSafe, optimised + assertions)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Replay the golden vectors (ReleaseSafe, narrowest lane width)
        run: zig build test -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Replay the golden vectors (ReleaseFast, as shipped)
        run: zig build test -Doptimize=ReleaseFast

      - name: Replay at the narrowest lane width (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast -Dcpu=baseline

      # Re-capture, twice. The fixture is written by the generator, which is
      # itself built for a target -- so reproducing at the host width alone
      # would leave a capture that depended on the width unnoticed.
      - name: Re-capture and diff against the committed fixture
        run: zig build reproduce

      - name: Re-capture at the narrowest lane width
        run: zig build reproduce -Dcpu=baseline

      - name: Build the library
        run: zig build -Doptimize=ReleaseFast

      # Informational: a number in the log, so a regression is visible in the
      # history. Shared runners are noisy; this does not gate.
      - name: Benchmark
        continue-on-error: true
        run: zig build bench -Doptimize=ReleaseFast
